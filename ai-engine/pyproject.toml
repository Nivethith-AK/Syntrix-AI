[project]
name = "syntrix-ai-engine"
version = "0.4.0"
description = "Syntrix AI orchestration, LangGraph agents, provider abstraction"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "langgraph>=0.2.60",
  "psycopg[binary,pool]>=3.2.0",
]

[project.optional-dependencies]
checkpoints = [
  "langgraph-checkpoint-postgres>=2.0.0",
  "langchain-core>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["syntrix_ai"]
