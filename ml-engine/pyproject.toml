[project]
name = "syntrix-ml-engine"
version = "0.3.0"
description = "Syntrix ML / data processing engine"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=2.0.0",
  "pyarrow>=18.0.0",
  "openpyxl>=3.1.0",
  "scikit-learn>=1.5.0",
  "xgboost>=2.1.0",
  "joblib>=1.4.0",
  "fpdf2>=2.8.0",
  "mlflow>=2.19.0",
]

[project.optional-dependencies]
explain = [
  "shap>=0.46.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["syntrix_ml"]
