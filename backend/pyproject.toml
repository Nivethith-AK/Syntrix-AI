[project]
name = "syntrix-backend"
version = "0.1.0"
description = "Syntrix AI FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg[binary]>=3.2.0",
  "python-jose[cryptography]>=3.3.0",
  "PyJWT[crypto]>=2.10.0",
  "cryptography>=44.0.0",
  "httpx>=0.28.0",
  "celery[redis]>=5.4.0",
  "redis>=5.2.0",
  "python-multipart>=0.0.20",
  "email-validator>=2.2.0",
  "syntrix-ai-engine",
  "syntrix-ml-engine",
]

[tool.uv.sources]
syntrix-ai-engine = { workspace = true }
syntrix-ml-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
